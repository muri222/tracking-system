name: Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    steps:
      - name: flush-capi (a cada 5 min)
        run: curl -fsS "${{ secrets.APP_URL }}/api/cron/flush-capi?secret=${{ secrets.CRON_SECRET }}"
      - name: sync-meta (so no minuto 0/15/30/45)
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" = "00" ] || [ "$MIN" = "15" ] || [ "$MIN" = "30" ] || [ "$MIN" = "45" ]; then
            curl -fsS "${{ secrets.APP_URL }}/api/cron/sync-meta?days=3&secret=${{ secrets.CRON_SECRET }}"
          else
            echo "skip, roda so a cada 15min"
          fi
